# Dated public-safe evidence; no current runtime claim.
date: 2026-09-23
title: Homelab operational baseline and security/recovery verification
change_type: verification
status: verified

intent:
  - Establish a bounded post-extraction baseline for the independent Homelab project
  - Verify the highest-value operational, security, recovery, and gaming assumptions without publishing private live topology

scope:
  - core-services environment
  - virtualization environment
  - private DNS and ingress
  - observability
  - remote administration security
  - backup and recovery continuity
  - isolated gaming workload

summary:
  - Verified the core-services host was stable and the expected containerized capability classes were running
  - Corrected a private split-DNS routing omission and verified owner-facing private service resolution
  - Verified the reverse-proxy, DNS, availability, metrics, dashboard, password-management, and related operator surfaces were responding as expected
  - Verified the metrics system was scraping both the core-services and virtualization environments
  - Identified that password SSH remained enabled on the core-services host because an earlier cloud-init drop-in won configuration precedence
  - Moved the owner SSH policy earlier in configuration order and changed effective remote authentication to key-only
  - Tested intended non-public SSH, DNS, HTTP, and HTTPS surfaces from a genuinely external IPv4 network and observed no successful connection
  - Verified recent local and encrypted off-site Restic backup jobs completed successfully
  - Verified the scheduled local hypervisor backup for the gaming VM had produced an expected archive
  - Confirmed Crafty Controller was running and an isolated modded Minecraft workload explained temporary high VM memory use; stopping the on-demand workload returned the VM to low idle usage
  - Preserved public IPv6 exposure as unknown because the available external test path did not provide usable IPv6 routing

verification:
  - Core-services system manager reported no failed units during the bounded observation
  - Expected service containers were running; selected applications also reported their own healthy state
  - Private DNS resolution succeeded after the scoped routing correction
  - Reverse-proxy routers/services and visible monitoring targets reported healthy state
  - SSH daemon configuration passed syntax validation before reload
  - A fresh public-key-only SSH session succeeded after hardening
  - A fresh password-only SSH attempt failed after hardening
  - External IPv4 reachability checks were performed from a separate cellular network with private overlay access disabled
  - Local and off-site Restic backup services reported successful most-recent completion
  - Scheduled VM backup configuration and produced archive were both observed
  - Gaming workload memory attribution was confirmed from the active Java process and post-shutdown memory state

known_limits:
  - This record does not establish current runtime state after 2026-09-23
  - Public IPv6 exposure was not verified
  - Hypervisor-local VM backup remains in the virtualization host failure domain
  - Power-loss resilience was not demonstrated by a verified UPS
  - The record does not publish exact hosts, addresses, private DNS, routes, ports, inventory, backup destinations, credential locations, or operational commands

documentation_outputs:
  - Refined the public Homelab architecture and service records
  - Added a dated evidence anchor without turning the public repository into a live status surface
